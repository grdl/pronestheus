version: 2

before:
  hooks:
    - go mod download

builds:
  - id: pronestheus
    main: ./cmd/pronestheus/main.go
    binary: pronestheus
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: archive
    format_overrides:
      - goos: windows
        format: zip
    # Don't include any additional files into the archives (such as README, CHANGELOG etc).
    files:
      - none*

checksum:
  name_template: 'checksums.txt'

changelog:
  disable: true

release:
  github:
    owner: grdl
    name: pronestheus

dockers:
  - use: buildx
    dockerfile: Dockerfile
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
    image_templates:
      - "grdl/pronestheus:{{ .Tag }}-amd64"
      - "grdl/pronestheus:latest-amd64"
  - use: buildx
    dockerfile: Dockerfile
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
    image_templates:
      - "grdl/pronestheus:{{ .Tag }}-arm64"
      - "grdl/pronestheus:latest-arm64"

docker_manifests:
  - name_template: "grdl/pronestheus:{{ .Tag }}"
    image_templates:
      - "grdl/pronestheus:{{ .Tag }}-amd64"
      - "grdl/pronestheus:{{ .Tag }}-arm64"
  - name_template: "grdl/pronestheus:latest"
    image_templates:
      - "grdl/pronestheus:latest-amd64"
      - "grdl/pronestheus:latest-arm64"

nfpms:
  - license: MIT
    maintainer: grdl
    homepage: https://github.com/grdl/pronestheus
    bindir: /usr/local/bin
    description: Prometheus exporter for the Nest Learning Thermostat
    formats:
      - deb
      - rpm
